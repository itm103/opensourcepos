version: "3.8"

volumes:
  uploads:
    driver: local
  logs:
    driver: local
  mysql:
    driver: local

services:
  mysql:
    image: mariadb:10.5
    container_name: mysql_ospos
    restart: always
    volumes:
      - mysql:/var/lib/mysql:rw
    environment:
      - MYSQL_ROOT_PASSWORD=pointofsale
      - MYSQL_DATABASE=ospos
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=pointofsale

  ospos:
    image: jekkos/opensourcepos:latest
    container_name: ospos
    restart: always
    depends_on:
      - mysql
    expose:
      - "80"
    volumes:
      - uploads:/app/public/uploads
      - logs:/app/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.ospos-csp.headers.customresponseheaders.Content-Security-Policy=upgrade-insecure-requests"
      - "traefik.http.routers.ospos.middlewares=ospos-csp"
    environment:
      - PROXY_MODE=true
      - CI_ENVIRONMENT=development
      - ALLOWED_HOSTNAMES=pos.craftedchunks.com
      - MYSQL_USERNAME=admin
      - MYSQL_PASSWORD=pointofsale
      - MYSQL_DB_NAME=ospos
      - MYSQL_HOST_NAME=mysql
      - PHP_TIMEZONE=UTC
      - PHP_INI_DISPLAY_ERRORS=On
      - PHP_INI_STARTUP_ERRORS=On
      - PHP_INI_ERROR_REPORTING=E_ALL